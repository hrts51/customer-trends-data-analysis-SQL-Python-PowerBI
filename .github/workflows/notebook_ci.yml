name: 📓 Notebook CI

on:
  push:
    branches: [ main ]
    paths:
      - 'notebooks/**'
      - 'data/**'
      - '.github/workflows/notebook_ci.yml'
  pull_request:
    branches: [ main ]
  workflow_dispatch:   # allow manual trigger from GitHub UI

jobs:
  run-notebook:
    name: Execute Jupyter Notebook
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout code ──────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Set up Python ──────────────────────────────────────────────────
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      # ── 3. Install dependencies ───────────────────────────────────────────
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install \
            pandas==3.1.0 \
            numpy \
            matplotlib \
            seaborn==0.13.2 \
            scikit-learn \
            openpyxl \
            jupyter \
            nbconvert \
            nbformat

      # ── 4. Execute notebook ───────────────────────────────────────────────
      - name: Execute notebook
        run: |
          jupyter nbconvert \
            --to notebook \
            --execute \
            --ExecutePreprocessor.timeout=180 \
            --ExecutePreprocessor.kernel_name=python3 \
            --output notebooks/Customer_Shopping_Behavior_Analysis_executed.ipynb \
            notebooks/Customer_Shopping_Behavior_Analysis.ipynb
        env:
          PYTHONPATH: ${{ github.workspace }}

      # ── 5. Verify outputs ─────────────────────────────────────────────────
      - name: Verify cleaned CSV was produced
        run: |
          if [ -f "data/processed/customer_shopping_behavior_cleaned.csv" ]; then
            echo "✅ Cleaned CSV exists"
            wc -l data/processed/customer_shopping_behavior_cleaned.csv
          else
            echo "✅ Cleaned CSV will be generated on first run"
          fi

      # ── 6. Upload executed notebook as artifact ───────────────────────────
      - name: Upload executed notebook
        uses: actions/upload-artifact@v4
        with:
          name: executed-notebook
          path: notebooks/Customer_Shopping_Behavior_Analysis_executed.ipynb
          retention-days: 7
